<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Da Nang Family Escape</title>
  <meta name="theme-color" content="#14b8a6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
         background:#14b8a6;color:#fff;font-family:system-ui,sans-serif;text-align:center}
    img{width:96px;height:96px;border-radius:22px;margin-bottom:16px}
    a{color:#fff;font-weight:600}
  </style>
</head>
<body>
  <img src="icon-192.png" alt="">
  <h2>Da Nang Family Escape</h2>
  <p>Opening your trip app…</p>
  <p><a id="manual" href="#">Tap here if it doesn't open</a></p>

  <script>
    // >>> Replace with YOUR Apps Script web app URL (the one ending in /exec) <<<
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwaezJrfaIHUmNkAuAIX_44pV23wW5AyeVlHtlzkC4S2pParYSQxYMLMzURQrK8tY9f/exec';

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

    document.getElementById('manual').href = APP_URL;
    if (APP_URL.indexOf('https://script.google.com/') === 0) {
      setTimeout(() => location.replace(APP_URL), 400);
    } else {
      document.querySelector('p').textContent = 'APP_URL is not set yet. Edit index.html and paste your /exec link.';
    }
  </script>
</body>
</html>
